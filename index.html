<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haus 3D – Blender-Vorbereitung v0.9</title>
<style>
:root{--bg:#0e1116;--panel:#171b22d9;--line:#2a313c;--text:#e8ecf2;--mute:#8a94a3;--acc:#5aa9ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.sub{color:var(--mute);font-size:12px}
#comp{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;background:var(--panel);position:relative;transition:none}
#comp span{position:absolute;font-size:10px;color:var(--mute)}
#comp .n{top:3px;left:50%;transform:translateX(-50%);color:var(--acc);font-weight:700}
#comp .s{bottom:3px;left:50%;transform:translateX(-50%)}
#comp .w{left:5px;top:50%;transform:translateY(-50%)}
#comp .e{right:5px;top:50%;transform:translateY(-50%)}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:560px;margin:0 auto;backdrop-filter:blur(8px)}
.btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
button{flex:1;min-width:56px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 6px;font:inherit;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#07101a;font-weight:600}
#rooms{color:var(--mute);font-size:12px;max-height:84px;overflow:auto}
#rooms b{color:var(--text);font-weight:500}
.card{max-height:46vh;overflow:auto}
#modes{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 100px)}
#modes button{flex:none;min-width:0;padding:5px 10px;font-size:12px;border-radius:999px;background:var(--panel)}
#stat{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 100px);font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row>span{width:84px;color:var(--mute)}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row button{flex:none;min-width:38px;padding:5px 10px}
.hd{font-weight:600;margin-bottom:2px}
.note{margin-top:8px;font-size:11px;color:var(--mute)}
</style>
</head>

<canvas id="c"></canvas>
<div class="top">
  <div><h1>Haus 3D · Entwurf v0.8</h1><div class="sub">Digitaler Zwilling · Visualisierung</div></div>
  <div id="comp"><span class="n">N</span><span class="e">O</span><span class="s">S</span><span class="w">W</span></div>
</div>
<div class="bot"><div class="card">
  <div class="btns" id="btns">
    <button data-f="all" class="on">Alle</button><button data-f="kg">Keller</button><button data-f="eg">EG</button><button data-f="og">OG</button><button id="rf" class="on">Dach</button><button id="mood">Tag/Abend</button><button id="exportArch">Blender-Daten ↓</button>
  </div>
  <div id="rooms"></div>

</div></div>

function mood(){S.background=night?bgN:bgD;S.fog.color.set(night?0x0c1016:0xcfe0ee);hemi.intensity=night?.5:.85;hemi.color.set(night?0x9fb4d8:0xcfe0ff);
 sun.intensity=night?.9:1.25;sun.color.set(night?0xcfd8ff:0xfff0d8);glassM.emissive.set(night?0xffa84a:0x000000);glassM.emissiveIntensity=.55;R.toneMappingExposure=night?1.2:1.05;
 document.getElementById('mood').textContent=night?'Abend':'Tag'}
const f2=n=>n==null?'':(' '+String(n).replace('.',',')+' m²');
let sel='all',roof=true,pick=null;
// Zustand je Raum (Licht). Später von Home Assistant befüllt: twin.setLight('eg:Küche',true,80)
const LS={},rid=(k,i)=>k+':'+D[k].rooms[i][0];
function paint(){hit.forEach(m=>{const k=m.userData.k,i=m.userData.i,r=D[k].rooms[i],x=LS[rid(k,i)],
 lit=x&&x.on?x.bri/100:0,p=pick&&pick.k===k&&pick.i===i?.22:0;r.mat.emissive.setRGB(.3*lit+p,.22*lit+p,.1*lit+p);const pl=PLS[rid(k,i)];if(pl)pl.intensity=lit*9})}
function info(){const L=sel==='all'?['kg','eg','og']:[sel];let h;
 if(pick){const r=D[pick.k].rooms[pick.i];h='<b>'+r[0]+'</b> ('+D[pick.k].name+')'+(r[1]?' · '+f2(r[1]).trim()+' laut Plan':'')+'<br>Lage grob aus dem Plan abgelesen.'}
 else h=L.map(k=>'<b>'+D[k].name+'</b>: '+D[k].rooms.filter(r=>r[1]).map(r=>r[0]+f2(r[1])).join(' · ')).join('<br>');
 document.getElementById('rooms').innerHTML=h}
['eg:Wohnen/Essen','eg:Küche','eg:Diele','og:Kind 1','og:Schlafen'].forEach(id=>LS[id]={on:true,bri:85});
window.twin={rooms:Object.keys(D).flatMap(k=>D[k].rooms.map((r,i)=>rid(k,i))),
 setLight(id,on,bri=80){LS[id]={on:!!on,bri:bri};paint()},select(id){const k=id.split(':')[0];D[k].rooms.forEach((r,i)=>{if(rid(k,i)===id)pick={k,i}});apply()}};
function apply(){
 G.kg.visible=sel==='all'||sel==='kg';G.eg.visible=sel==='all'||sel==='eg';G.og.visible=sel==='all'||sel==='og';
 G.roof.visible=sel==='all'&&roof;G.env.visible=sel!=='kg';
 labels.forEach(l=>l.visible=sel!=='all'&&l.userData.k===sel);
 document.getElementById('rf').style.opacity=sel==='all'?1:.35;
 document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===sel));

 info()}

 if(b.id==='mood'){night=!night;mood();return}
 if(b.id==='rf'){if(sel==='all'){roof=!roof;b.classList.toggle('on',roof)}}else{sel=b.dataset.f;pick=null}apply()});

  coordinate_system:'Web x east, z south, y up; Blender importer maps (x,z,y) to (x,-z,y)',

// Kamerasteuerung (eigene, da OrbitControls in r128 nicht im Kern liegt)
const T=new THREE.Vector3(4.5,2.5,6.4);let th=-0.8,ph=1.12,r=40;const P=new Map(),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const p0=P.get(e.pointerId),n=[e.clientX,e.clientY];
 if(P.size===1){th-=(n[0]-p0[0])*0.006;ph=cl(ph-(n[1]-p0[1])*0.006,0.12,1.5)}
 else if(P.size===2){const q=[...P.entries()].find(([k])=>k!==e.pointerId)[1];
  r=cl(r*Math.hypot(p0[0]-q[0],p0[1]-q[1])/Math.hypot(n[0]-q[0],n[1]-q[1]),14,100)}
 P.set(e.pointerId,n)});
let down=null;cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
const RC=new THREE.Raycaster();
cv.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6&&P.size<=1){
 RC.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
 const h=RC.intersectObjects(hit.filter(m=>m.parent.visible)).filter(x=>true)[0];
 pick=h?{k:h.object.userData.k,i:h.object.userData.i}:null;apply()}P.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>P.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();r=cl(r*(1+e.deltaY*0.001),14,100)},{passive:false});
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
const comp=document.getElementById('comp');
(function loop(){cam.position.set(T.x+r*Math.sin(ph)*Math.sin(th),T.y+r*Math.cos(ph),T.z+r*Math.sin(ph)*Math.cos(th));
 cam.lookAt(T);comp.style.transform='rotate('+th+'rad)';R.render(S,cam);requestAnimationFrame(loop)})();
